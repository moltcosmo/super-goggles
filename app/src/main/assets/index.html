<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f2">
<title>Print Job Manager</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20231f;background:#f6f6f2;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#20231f;--muted:#73786f;--line:#e6e8e1;--paper:#fff;--green:#245c43;--green2:#e7f0e9;--amber:#a76519;--amberbg:#fff2df;--red:#a83b32;--redbg:#fcebe8}
*{box-sizing:border-box}body{margin:0;padding:0 0 calc(82px + env(safe-area-inset-bottom));background:#f6f6f2}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:0 auto;min-height:100vh}.top{padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:850;font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:750}.brand strong{font-size:15px}.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:18px;color:var(--ink)}main{padding:8px 18px 26px}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:10px 2px 18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.pagehead h1{font-size:27px;letter-spacing:-.04em;margin:4px 0 0}.sub{color:var(--muted);font-size:13px;margin:5px 0 0}.btn{border:0;border-radius:13px;background:var(--green);color:white;font-weight:750;padding:12px 15px;min-height:44px}.btn.secondary{background:#edf0eb;color:var(--ink)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.small{padding:9px 12px;min-height:36px;font-size:12px;border-radius:10px}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.stat,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px}.stat .label{color:var(--muted);font-size:12px;font-weight:650}.stat .value{font-size:25px;font-weight:850;letter-spacing:-.04em;margin-top:7px}.stat .hint{font-size:11px;color:var(--muted);margin-top:2px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 11px}.sectiontitle h2{font-size:15px;margin:0}.link{border:0;background:none;color:var(--green);font-size:12px;font-weight:800;padding:5px}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;color:inherit}.item:active{background:#f0f3ed}.itembody{min-width:0;flex:1}.itemtitle{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemmeta{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}.itemright{text-align:right;flex-shrink:0}.amount{font-size:13px;font-weight:800}.chev{font-size:20px;color:#a0a59b}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#eff1ed;color:#5b6259;white-space:nowrap}.pill.green{background:var(--green2);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.red{background:var(--redbg);color:var(--red)}.search{width:100%;height:45px;border:1px solid var(--line);border-radius:13px;background:white;padding:0 14px;outline:none;margin-bottom:12px}.search:focus,input:focus,select:focus,textarea:focus{border-color:#75947f;box-shadow:0 0 0 3px #e4eee6;outline:none}.empty{padding:30px 18px;text-align:center;border:1px dashed #d7dbd2;border-radius:17px;color:var(--muted);background:#fbfcf9}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:100%;max-width:680px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;background:transparent;color:#82877e;border-radius:12px;padding:7px 2px 5px;font-size:10px;font-weight:750}.nav button span{display:block;font-size:19px;margin-bottom:3px}.nav button.active{color:var(--green);background:#edf3ed}.overlay{position:fixed;inset:0;background:#14191466;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fdfdfa;width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:23px 23px 0 0;padding:18px 19px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 50px #0002}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.sheethead h2{font-size:19px;margin:0}.close{border:0;background:#eff1ed;width:34px;height:34px;border-radius:11px;font-size:18px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:750;color:#51574f}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;color:var(--ink);min-height:44px}.field textarea{min-height:80px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formactions{display:flex;gap:9px;margin-top:18px}.formactions>*{flex:1}.detailtop{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px}.detailtop h2{font-size:20px;margin:5px 0}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.detailmetric{background:#f5f6f2;border-radius:12px;padding:11px}.detailmetric small{color:var(--muted);display:block;font-size:11px}.detailmetric b{display:block;font-size:15px;margin-top:4px}.stage{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.stage:last-child{border-bottom:0}.stageicon{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#eff1ed;color:#6b7168;font-size:12px;font-weight:850;flex-shrink:0}.stageicon.done{background:var(--green2);color:var(--green)}.stagebody{flex:1;min-width:0}.stagebody b{font-size:13px}.stagebody small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.stageactions{margin-top:9px}.muted{color:var(--muted)}.divider{height:1px;background:var(--line);margin:14px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.toolbar .search{flex:1;min-width:150px;margin:0}.moregrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.moretile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;color:var(--ink)}.moretile span{font-size:22px;display:block;margin-bottom:10px}.moretile b{font-size:13px;display:block}.moretile small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);z-index:50;background:#202720;color:#fff;border-radius:12px;padding:11px 15px;font-size:12px;box-shadow:0 8px 25px #0003;max-width:90%;text-align:center}.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">P</div><div><small>Print shop workspace</small><strong>Print Job Manager</strong></div></div><button class="iconbtn" onclick="refreshCurrent()" aria-label="Refresh">↻</button></header>
<main id="main"></main>
</div>
<nav class="bottom"><div class="nav"><button id="nav-home" onclick="go('home')"><span>⌂</span>Home</button><button id="nav-orders" onclick="go('orders')"><span>▤</span>Orders</button><button id="nav-projects" onclick="go('projects')"><span>▦</span>Projects</button><button id="nav-more" onclick="go('more')"><span>•••</span>More</button></div></nav>
<div id="modal"></div><div id="toast" class="toast hide"></div>
<script>
const $=id=>document.getElementById(id);const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};const localDateTime=ms=>{const d=ms?new Date(ms):new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};const dateText=v=>v?new Date(v).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'Belum ditentukan';const dtText=v=>v?new Date(v).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Belum dijadwalkan';const esc=s=>String(s===null||s===undefined?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='home',selectedOrder=0,selectedProject=0,selectedLayoutCalculation=0,layoutProjectId=0,searchText='',listOffset=0;
function bridge(){if(!window.Android)throw Error('Android bridge tidak tersedia');return Android}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2300)}
function parse(v){try{return JSON.parse(v||'[]')}catch(e){return []}}
function go(p){page=p;selectedOrder=0;selectedProject=0;searchText='';listOffset=0;render()}
function setNav(){['home','orders','projects','more'].forEach(x=>$('nav-'+x).classList.toggle('active',page===x||((page==='orderDetail')&&x==='orders')||((['projectDetail','projectHpp'].includes(page)||page==='layoutOptimizer'&&layoutProjectId>0)&&x==='projects')||((['customers','templates','costComponents'].includes(page)||page==='layoutOptimizer'&&layoutProjectId===0)&&x==='more')))}
function refreshCurrent(){render();toast('Data diperbarui')}
function render(){setNav();try{if(page==='home')home();else if(page==='orders')orders();else if(page==='projects')projects();else if(page==='orderDetail')orderDetail(selectedOrder);else if(page==='projectDetail')projectDetail(selectedProject);else if(page==='more')more();else if(page==='customers')customers();else if(page==='templates')templates();else if(page==='costComponents')costComponents();else if(page==='projectHpp')projectHpp(selectedProject);else if(page==='layoutOptimizer')layoutOptimizer(layoutProjectId);}catch(e){$('main').innerHTML='<div class="empty"><b>Belum dapat memuat data</b>'+esc(e.message)+'</div>'}}
function home(){const os=parse(bridge().listSalesOrders('',20,0));const ps=parse(bridge().listProjects(0,'',20,0));const active=ps.filter(p=>p.status==='active');const due=ps.filter(p=>p.deadline_at&&p.deadline_at<Date.now()&&p.status!=='completed'&&p.status!=='cancelled');$('main').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Ringkasan usaha</div><h1>Selamat bekerja.</h1><p class="sub">Pantau order dan pekerjaan produksi hari ini.</p></div></div><div class="grid"><div class="stat"><div class="label">Total Sales Order</div><div class="value">${os.length}</div><div class="hint">Order tercatat</div></div><div class="stat"><div class="label">Project aktif</div><div class="value">${active.length}</div><div class="hint">Sedang dikerjakan</div></div><div class="stat"><div class="label">Perlu perhatian</div><div class="value" style="color:${due.length?'var(--red)':'var(--green)'}">${due.length}</div><div class="hint">Melewati deadline</div></div><div class="stat"><div class="label">Nilai order</div><div class="value" style="font-size:19px">${money(os.reduce((a,x)=>a+Number(x.total_amount||0),0))}</div><div class="hint">Total order aktif</div></div></div><div class="sectiontitle"><h2>Project terbaru</h2><button class="link" onclick="go('projects')">Lihat semua →</button></div>${ps.length?`<div class="list">${ps.slice(0,5).map(projectItem).join('')}</div>`:empty('Belum ada Project','Buat Sales Order lalu tambahkan Project pertama.') }<div class="sectiontitle"><h2>Mulai cepat</h2></div><div class="grid"><button class="moretile" onclick="openCustomerForm()"><span>＋</span><b>Customer baru</b><small>Tambah pelanggan</small></button><button class="moretile" onclick="openOrderForm()"><span>▤</span><b>Sales Order baru</b><small>Catat pesanan masuk</small></button></div>`}
function empty(title,desc){return `<div class="empty"><b>${esc(title)}</b>${esc(desc)}</div>`}
function statusPill(s){const map={draft:['Draft',''],confirmed:['Confirmed','green'],active:['Aktif','green'],completed:['Selesai','green'],cancelled:['Dibatalkan','red'],not_started:['Belum mulai',''],in_progress:['Berjalan','amber'],ordered:['Dipesan','amber'],received:['Diterima','green']};const x=map[s]||[s||'—',''];return `<span class="pill ${x[1]}">${x[0]}</span>`}
function orderItem(o){return `<button class="item" onclick="openOrder(${o.sales_order_id})"><div class="itembody"><div class="itemtitle">${esc(o.order_number)} · ${esc(o.customer_name)}</div><div class="itemmeta">${dateText(o.order_date)} · ${o.project_count} Project</div></div><div class="itemright"><div class="amount">${money(o.total_amount)}</div><div class="itemmeta">Sisa ${money(o.balance)}</div></div><div class="chev">›</div></button>`}
function projectItem(p){return `<button class="item" onclick="openProject(${p.id})"><div class="itembody"><div class="itemtitle">${esc(p.name)}</div><div class="itemmeta">${esc(p.project_number)} · ${esc(p.customer_name||p.order_number||'')}<br>Deadline: ${dateText(p.deadline_at)}</div></div><div class="itemright">${statusPill(p.status)}<div class="itemmeta">${money(p.sale_amount)}</div></div><div class="chev">›</div></button>`}
function orders(){listOffset=0;const q=searchText;$('main').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Komersial</div><h1>Sales Orders</h1><p class="sub">Pesanan customer dan pembayaran.</p></div><button class="btn" onclick="openOrderForm()">＋ Order</button></div><input class="search" placeholder="Cari nomor order atau customer…" value="${esc(q)}" oninput="searchText=this.value;listOffset=0;loadOrderList(true)"><div id="order-list"></div>`;loadOrderList(true)}
function loadOrderList(reset=false){const el=$('order-list');if(!el)return;if(reset){listOffset=0;el.innerHTML=''}const data=parse(bridge().listSalesOrders(searchText,20,listOffset));const html=data.map(orderItem).join('');if(reset&&!data.length){el.innerHTML=empty('Belum ada Sales Order','Tambahkan customer dan catat pesanan pertama.');return}let list;if(listOffset===0){el.innerHTML='<div class="list">'+html+'</div>';list=el.querySelector('.list')}else{list=el.querySelector('.list')}if(list&&listOffset!==0)list.insertAdjacentHTML('beforeend',html);listOffset+=data.length;const old=el.querySelector('.loadmore');if(old)old.remove();if(data.length===20)el.insertAdjacentHTML('beforeend','<button class="btn ghost loadmore" style="width:100%;margin-top:10px" onclick="loadOrderList()">Muat 20 berikutnya</button>')}
function projects(){listOffset=0;const q=searchText;$('main').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Produksi</div><h1>Projects</h1><p class="sub">Pekerjaan produksi dan deadline.</p></div><button class="btn" onclick="openProjectForm()">＋ Project</button></div><input class="search" placeholder="Cari project, customer, nomor order…" value="${esc(q)}" oninput="searchText=this.value;listOffset=0;loadProjectList(true)"><div id="project-list"></div>`;loadProjectList(true)}
function loadProjectList(reset=false){const el=$('project-list');if(!el)return;if(reset){listOffset=0;el.innerHTML=''}const data=parse(bridge().listProjects(0,searchText,20,listOffset));const html=data.map(projectItem).join('');if(reset&&!data.length){el.innerHTML=empty('Belum ada Project','Tambahkan Project dari Sales Order.');return}let list;if(listOffset===0){el.innerHTML='<div class="list">'+html+'</div>';list=el.querySelector('.list')}else{list=el.querySelector('.list')}if(list&&listOffset!==0)list.insertAdjacentHTML('beforeend',html);listOffset+=data.length;const old=el.querySelector('.loadmore');if(old)old.remove();if(data.length===20)el.insertAdjacentHTML('beforeend','<button class="btn ghost loadmore" style="width:100%;margin-top:10px" onclick="loadProjectList()">Muat 20 berikutnya</button>')}
function openOrder(id){selectedOrder=id;page='orderDetail';render()}
function openProject(id){selectedProject=id;page='projectDetail';render()}
function orderDetail(id){const o=JSON.parse(bridge().getSalesOrder(id));if(!o.sales_order_id){go('orders');return}const payments=parse(bridge().listPayments(id));const projs=parse(bridge().listProjects(id,'',20,0));$('main').innerHTML=`<div class="pagehead"><div><button class="link" onclick="go('orders')">← Sales Orders</button><div class="eyebrow">Detail pesanan</div><h1>${esc(o.order_number)}</h1><p class="sub">${esc(o.customer_name)} · ${dateText(o.order_date)}</p></div></div><div class="detailtop"><div class="eyebrow">Nilai pesanan</div><h2>${money(o.total_amount)}</h2><div class="detailgrid"><div class="detailmetric"><small>Total dibayar</small><b>${money(o.total_paid)}</b></div><div class="detailmetric"><small>Sisa pembayaran</small><b>${money(o.balance)}</b></div></div><div style="margin-top:13px">${statusPill(o.status)}</div></div><div class="sectiontitle"><h2>Projects (${projs.length})</h2><button class="btn small" onclick="openProjectForm(${id})">＋ Tambah</button></div>${projs.length?`<div class="list">${projs.map(projectItem).join('')}</div>`:empty('Belum ada Project','Tambahkan pekerjaan yang termasuk dalam order ini.')}<div class="sectiontitle"><h2>Riwayat pembayaran (${payments.length})</h2><button class="btn small" onclick="openPaymentForm(${id})">＋ Pembayaran</button></div>${payments.length?`<div class="list">${payments.map(p=>`<div class="item"><div class="itembody"><div class="itemtitle">${money(p.amount)} ${statusPill(p.status)}</div><div class="itemmeta">${new Date(p.paid_at).toLocaleString('id-ID')} · ${esc(p.method)}${p.reference?' · '+esc(p.reference):''}</div></div>${p.status==='valid'?`<button class="btn ghost small" onclick="voidPay(${p.id},${id})">Void</button>`:''}</div>`).join('')}</div>`:empty('Belum ada pembayaran','Catat DP atau pembayaran yang diterima.')}`}
function projectDetail(id){const p=JSON.parse(bridge().getProject(id));if(!p.id){go('projects');return}const stages=parse(bridge().listProjectStages(id));$('main').innerHTML=`<div class="pagehead"><div><button class="link" onclick="go('projects')">← Projects</button><div class="eyebrow">${esc(p.project_number)}</div><h1>${esc(p.name)}</h1><p class="sub">${esc(p.customer_name)} · ${esc(p.order_number)}</p></div></div><div class="detailtop"><div style="display:flex;justify-content:space-between;align-items:center"><div class="eyebrow">Project overview</div>${statusPill(p.status)}</div><div class="detailgrid"><div class="detailmetric"><small>Nilai jual</small><b>${money(p.sale_amount)}</b></div><div class="detailmetric"><small>Jumlah</small><b>${Number(p.quantity).toLocaleString('id-ID')} ${esc(p.unit)}</b></div><div class="detailmetric"><small>Deadline</small><b>${dateText(p.deadline_at)}</b></div><div class="detailmetric"><small>Progress</small><b>${stages.filter(s=>s.status==='completed').length} / ${stages.length} tahap</b></div></div></div><div class="sectiontitle"><h2>Workflow</h2><button class="btn small" onclick="openStageForm(${id},${stages.length+1})">＋ Tahap</button></div>${stages.length?`<div class="card">${stages.map((s,i)=>`<div class="stage"><div class="stageicon ${s.status==='completed'?'done':''}">${s.status==='completed'?'✓':i+1}</div><div class="stagebody"><b>${esc(s.name)}</b><small>${statusPill(s.status)} ${s.assigned_to?' · PIC '+esc(s.assigned_to):''}</small><small>Estimasi: ${dtText(s.estimated_at)}</small>${s.status!=='completed'?`<div class="stageactions"><button class="btn small ${s.status==='in_progress'?'secondary':''}" onclick="${s.status==='in_progress'?`completeStage(${s.id},${id})`:`startStage(${s.id},${id})`}">${s.status==='in_progress'?'Selesaikan tahap':'Mulai tahap'}</button> <button class="btn ghost small" onclick="openEstimateForm(${s.id},${id},${s.estimated_at||0},'${esc(s.assigned_to||'')}')">Atur estimasi</button></div>`:''}</div></div>`).join('')}</div>`:empty('Workflow belum dibuat','Tambahkan tahap satu per satu atau buat template workflow di menu More.') }<div class="sectiontitle"><h2>Perhitungan HPP</h2><button class="btn small" onclick="openProjectHpp(${id})">Buka HPP →</button></div><div class="card"><div class="itemmeta">Kelola biaya bahan, proses cetak, finishing, dan biaya lainnya untuk Project ini.</div><button class="btn secondary" style="margin-top:12px" onclick="openLayoutOptimizer(${id})">▦ Optimasi kertas</button></div><div class="sectiontitle"><h2>Catatan pekerjaan</h2></div><div class="card"><div class="itemmeta">${esc(p.description||'Belum ada deskripsi Project.')}</div></div>`}
function more(){$('main').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Pengaturan & lainnya</div><h1>More</h1><p class="sub">Master data dan alat pendukung.</p></div></div><div class="moregrid"><button class="moretile" onclick="go('customers')"><span>♙</span><b>Customers</b><small>Daftar pelanggan</small></button><button class="moretile" onclick="go('templates')"><span>☷</span><b>Workflow templates</b><small>Template tahapan produksi</small></button><button class="moretile" onclick="go('costComponents')"><span>◈</span><b>HPP Calculator</b><small>Setting komponen biaya</small></button><button class="moretile" onclick="openLayoutOptimizer(0)"><span>▦</span><b>Paper Layout</b><small>Hitung pola potong plano</small></button><button class="moretile" onclick="toast('Modul Purchasing akan kita bangun pada tahap berikutnya')"><span>▣</span><b>Purchasing</b><small>Pembelian bahan dan kebutuhan</small></button><button class="moretile" onclick="toast('Export dan backup akan kita bangun pada tahap berikutnya')"><span>⇧</span><b>Export & Backup</b><small>Portabilitas data</small></button><button class="moretile" onclick="aboutApp()"><span>ⓘ</span><b>About</b><small>Informasi aplikasi</small></button></div>`}
function openLayoutOptimizer(projectId=0){layoutProjectId=projectId;selectedLayoutCalculation=0;page='layoutOptimizer';render()}
function layoutOptimizer(projectId){const history=parse(bridge().listLayoutCalculations(projectId));const p=projectId?JSON.parse(bridge().getProject(projectId)):null;$('main').innerHTML=`<div class="pagehead"><div><button class="link" onclick="${projectId?`openProject(${projectId})`:`go('more')`}">← Kembali</button><div class="eyebrow">Alat produksi</div><h1>Paper Layout Optimizer</h1><p class="sub">Cari pola potong plano untuk ukuran dan jumlah yang dibutuhkan${p&&p.id?' · '+esc(p.name):''}.</p></div></div><div class="card"><form onsubmit="calculateLayoutForm(event,${projectId})"><div class="sectiontitle"><h2>Ukuran plano (mm)</h2></div><div class="formrow"><div class="field"><label>Lebar plano *</label><input id="lo-sw" type="number" min="1" step="any" value="650" required></div><div class="field"><label>Tinggi plano *</label><input id="lo-sh" type="number" min="1" step="any" value="900" required></div></div><div class="sectiontitle"><h2>Ukuran potong (mm)</h2></div><div class="formrow"><div class="field"><label>Lebar potong *</label><input id="lo-cw" type="number" min="1" step="any" value="210" required></div><div class="field"><label>Tinggi potong *</label><input id="lo-ch" type="number" min="1" step="any" value="297" required></div></div><div class="field"><label>Jumlah yang dibutuhkan *</label><input id="lo-qty" type="number" min="1" step="1" value="500" required></div><div class="formrow"><div class="field"><label>Margin tepi (mm)</label><input id="lo-margin" type="number" min="0" step="any" value="5"></div><div class="field"><label>Jarak pisau / kerf (mm)</label><input id="lo-kerf" type="number" min="0" step="any" value="2"></div></div><div class="field"><label>Arah serat / batas rotasi</label><select id="lo-grain"><option value="free">Bebas diputar</option><option value="width">Sisi lebar potong mengikuti lebar plano (tidak diputar)</option><option value="height">Sisi lebar potong mengikuti tinggi plano (diputar)</option></select></div><div class="itemmeta">Model perhitungan menggunakan pola guillotine berbasis baris: plano dibagi menjadi strip penuh, lalu setiap strip dipotong melintang. Pola campuran dapat menggabungkan orientasi normal dan diputar antarbaris.</div><div class="formactions"><button class="btn">Hitung pola</button></div></form></div><div id="layout-result"></div>${history.length?`<div class="sectiontitle"><h2>Perhitungan sebelumnya</h2></div><div class="list">${history.slice(0,10).map(h=>`<button class="item" onclick="showLayoutCalculation(${h.id},${projectId})"><div class="itembody"><div class="itemtitle">${h.cut_width_mm} × ${h.cut_height_mm} mm · ${Number(h.required_quantity).toLocaleString('id-ID')} pcs</div><div class="itemmeta">Plano ${h.source_width_mm} × ${h.source_height_mm} mm · ${new Date(h.created_at).toLocaleString('id-ID')}</div></div><div class="chev">›</div></button>`).join('')}</div>`:''}`;if(selectedLayoutCalculation)showLayoutCalculation(selectedLayoutCalculation,projectId)}
function calculateLayoutForm(e,projectId){e.preventDefault();const id=bridge().calculatePaperLayout(projectId,Number($('lo-sw').value),Number($('lo-sh').value),Number($('lo-cw').value),Number($('lo-ch').value),Number($('lo-qty').value),Number($('lo-margin').value),Number($('lo-kerf').value),$('lo-grain').value);if(id>0){selectedLayoutCalculation=id;toast('Pola potong berhasil dihitung');showLayoutCalculation(id,projectId)}else toast('Ukuran tidak valid atau tidak ada potongan yang muat')}
function showLayoutCalculation(calculationId,projectId){selectedLayoutCalculation=calculationId;const rows=parse(bridge().listLayoutPatterns(calculationId));const el=$('layout-result');if(!el)return;if(!rows.length){el.innerHTML=empty('Tidak ada pola yang muat','Periksa ukuran plano, ukuran potong, margin, dan batas rotasi.');return}const comps=projectId?parse(bridge().listCostComponents('media','')):[];el.innerHTML=`<div class="sectiontitle"><h2>Alternatif pola potong</h2></div><div class="list">${rows.map(r=>{const seq=parse(r.cutting_sequence_json);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div><div class="itemtitle">${esc(r.pattern_name)}</div><div class="itemmeta">${r.yield_per_sheet} potong per plano · ${r.sheets_required} plano untuk kebutuhan</div></div>${Number(r.is_selected)?'<span class="pill green">Dipilih</span>':''}</div><div class="detailgrid" style="margin-top:12px"><div class="detailmetric"><small>Waste</small><b>${Number(r.waste_percent).toFixed(1)}%</b></div><div class="detailmetric"><small>Efisiensi</small><b>${Number(r.efficiency).toFixed(1)}%</b></div></div><div class="itemmeta" style="margin-top:6px">Total sisa bidang: ${(Number(r.waste_area||0)/1000000).toFixed(3)} m² untuk ${r.sheets_required} plano</div><div class="itemmeta" style="margin-top:10px"><b>Diagram strip (skema)</b></div><div style="display:grid;gap:5px;margin-top:6px">${seq.map((x,i)=>`<div style="display:flex;align-items:center;gap:8px"><small style="width:76px;flex-shrink:0">Baris ${i+1}</small><div style="display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden;flex:1">${Array.from({length:Math.min(Number(x.pieces_per_row),18)},()=>`<span style="height:18px;min-width:10px;flex:1;border:1px solid var(--line);background:var(--soft);border-radius:2px"></span>`).join('')}${Number(x.pieces_per_row)>18?`<small>+${Number(x.pieces_per_row)-18}</small>`:''}</div><small>${x.orientation==='rotated'?'Putar':'Normal'} · ${x.pieces_per_row} pcs · ${Number(x.row_height_mm||0).toFixed(1)} mm</small></div>`).join('')}</div><div class="itemmeta" style="margin-top:8px"><b>Urutan guillotine:</b> ${seq.map((x,i)=>`Baris ${i+1}: ${x.orientation==='rotated'?'diputar':'normal'} (${x.pieces_per_row} potong)`).join(' → ')}</div><button class="btn ${Number(r.is_selected)?'secondary':''}" style="margin-top:12px" onclick="chooseLayoutPattern(${r.id},${projectId})">${Number(r.is_selected)?'Pola terpilih':'Pilih pola ini'}</button>${projectId&&comps.length?`<div class="field" style="margin-top:12px"><label>Komponen media untuk HPP</label><select id="layout-media-${r.id}">${comps.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.specification||'')} (${money(c.rate)}/${esc(c.rate_basis)})</option>`).join('')}</select></div><button class="btn secondary" style="width:100%;margin-top:8px" onclick="useLayoutInHpp(${projectId},${r.id})">Gunakan ${r.sheets_required} plano di HPP</button>`:''}</div>`}).join('')}</div><div class="card" style="margin-top:12px"><div class="itemmeta">Waste mencakup sisa bidang plano, margin, kerf, dan potongan tidak terpakai pada plano terakhir. Efisiensi dihitung dari luas produk yang dibutuhkan dibanding total luas plano yang harus disediakan. Hasil ini merupakan estimasi pola strip guillotine, bukan simulasi mesin potong multi-tahap yang lengkap.</div></div>`}
function chooseLayoutPattern(patternId,projectId){if(bridge().selectLayoutPattern(patternId)){showLayoutCalculation(selectedLayoutCalculation,projectId);toast('Pola dipilih')}else toast('Gagal memilih pola')}
function useLayoutInHpp(projectId,patternId){const sel=$('layout-media-'+patternId);if(!sel)return;bridge().selectLayoutPattern(patternId);const id=bridge().addLayoutPatternToProjectHpp(projectId,patternId,Number(sel.value));if(id>0){toast('Kebutuhan plano ditambahkan ke HPP');openProjectHpp(projectId)}else toast('Gagal menambahkan biaya. Pastikan pola berasal dari Project ini dan komponen berkategori Media.')}
function categoryLabel(c){return ({media:'Media',print_process:'Print Process',finishing:'Finishing',other_costs:'Other Costs'})[c]||c}
function openProjectHpp(id){selectedProject=id;page='projectHpp';render()}
function costComponents(){const data=parse(bridge().listCostComponents('',''));$('main').innerHTML=`<div class="pagehead"><div><button class="link" onclick="go('more')">← More</button><div class="eyebrow">Setting kalkulator</div><h1>Komponen HPP</h1><p class="sub">Daftar tarif yang dapat dipakai ulang pada perhitungan Project.</p></div><button class="btn" onclick="openCostComponentForm()">＋ Komponen</button></div><div class="card" style="margin-bottom:13px"><div class="itemmeta">Komponen di sini hanya setting kalkulator, bukan daftar stok atau produk. Perubahan tarif tidak mengubah HPP Project yang sudah dihitung.</div></div>${data.length?`<div class="list">${data.map(c=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div class="itembody"><div class="eyebrow">${categoryLabel(c.category)}</div><div class="itemtitle" style="margin-top:4px">${esc(c.name)}</div><div class="itemmeta">${esc(c.specification||'Tanpa spesifikasi')}<br>${money(c.rate)} / ${esc(c.rate_basis)} · Minimum ${money(c.minimum_charge)} · Setup ${money(c.setup_charge)}</div></div><button class="btn ghost small" onclick="openCostComponentForm(${c.id})">Edit</button></div></div>`).join('')}</div>`:empty('Belum ada komponen','Tambahkan komponen biaya yang sering digunakan.')}`}
function openCostComponentForm(id=0){const c=id?parse(bridge().listCostComponents('','')).find(x=>x.id===id):null;openModal(id?'Edit komponen HPP':'Komponen HPP baru',`<form onsubmit="saveCostComponentForm(event,${id})"><div class="field"><label>Kategori *</label><select id="cc-category"><option value="media" ${c?.category==='media'?'selected':''}>Media</option><option value="print_process" ${c?.category==='print_process'?'selected':''}>Print Process</option><option value="finishing" ${c?.category==='finishing'?'selected':''}>Finishing</option><option value="other_costs" ${c?.category==='other_costs'?'selected':''}>Other Costs</option></select></div><div class="field"><label>Nama komponen *</label><input id="cc-name" required value="${esc(c?.name||'')}" placeholder="Contoh: Art Paper"></div><div class="field"><label>Spesifikasi</label><input id="cc-spec" value="${esc(c?.specification||'')}" placeholder="Contoh: 120 gsm, 65 × 90 cm"></div><div class="formrow"><div class="field"><label>Satuan *</label><input id="cc-unit" required value="${esc(c?.unit||'lembar')}" placeholder="lembar"></div><div class="field"><label>Tarif per *</label><input id="cc-basis" required value="${esc(c?.rate_basis||'lembar')}" placeholder="lembar"></div></div><div class="field"><label>Tarif (Rp) *</label><input id="cc-rate" type="number" min="0" step="1" required value="${c?.rate??0}"></div><div class="formrow"><div class="field"><label>Biaya minimum (Rp)</label><input id="cc-min" type="number" min="0" step="1" value="${c?.minimum_charge??0}"></div><div class="field"><label>Biaya setup (Rp)</label><input id="cc-setup" type="number" min="0" step="1" value="${c?.setup_charge??0}"></div></div><p class="itemmeta">Rumus: nilai terbesar antara (jumlah × tarif) dan biaya minimum, kemudian ditambah biaya setup.</p><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan komponen</button></div></form>`)}
function saveCostComponentForm(e,id){e.preventDefault();const saved=bridge().saveCostComponent(id,$('cc-category').value,$('cc-name').value,$('cc-spec').value,$('cc-unit').value,Number($('cc-rate').value),$('cc-basis').value,Number($('cc-min').value),Number($('cc-setup').value),'{}');if(saved>0){closeModal();costComponents();toast('Komponen tersimpan')}else toast('Gagal menyimpan komponen')}
function projectHpp(id){const p=JSON.parse(bridge().getProject(id));if(!p.id){go('projects');return}const summary=JSON.parse(bridge().getProjectHppSummary(id));const lines=parse(bridge().listProjectCostLines(id));const cats=['media','print_process','finishing','other_costs'];$('main').innerHTML=`<div class="pagehead"><div><button class="link" onclick="openProject(${id})">← Project</button><div class="eyebrow">HPP Project</div><h1>${esc(p.name)}</h1><p class="sub">${esc(p.project_number)} · ${esc(p.customer_name)}</p></div><button class="btn" onclick="openProjectCostLineForm(${id})">＋ Biaya</button></div><div class="detailtop"><div class="eyebrow">Total HPP</div><h2>${money(summary.total_hpp)}</h2><div class="detailgrid"><div class="detailmetric"><small>HPP per ${esc(p.unit)}</small><b>${money(summary.hpp_per_unit)}</b></div><div class="detailmetric"><small>Nilai jual Project</small><b>${money(p.sale_amount)}</b></div></div><div class="detailmetric" style="margin-top:10px"><small>Selisih nilai jual dan HPP (belum termasuk analisis margin)</small><b>${money(Number(p.sale_amount||0)-Number(summary.total_hpp||0))}</b></div></div>${cats.map(cat=>{const rows=lines.filter(x=>x.category_snapshot===cat);const total=rows.reduce((a,x)=>a+Number(x.subtotal||0),0);return `<div class="sectiontitle"><h2>${categoryLabel(cat)}</h2><b>${money(total)}</b></div>${rows.length?`<div class="list">${rows.map(x=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(x.name_snapshot)}</div><div class="itemmeta">${esc(x.specification_snapshot||'')}<br>${Number(x.quantity).toLocaleString('id-ID')} ${esc(x.rate_basis_snapshot)} × ${money(x.rate_snapshot)} · Min ${money(x.minimum_charge_snapshot)} · Setup ${money(x.setup_charge_snapshot)}</div></div><div class="itemright"><b>${money(x.subtotal)}</b><button class="link" onclick="removeProjectCost(${x.id},${id})">Hapus</button></div></div>`).join('')}</div>`:empty('Belum ada biaya','Tambahkan komponen untuk kategori ini.')}`}).join('')}<div class="sectiontitle"><h2>Catatan perhitungan</h2></div><div class="card"><div class="itemmeta">Tarif dan spesifikasi pada baris biaya ini merupakan snapshot. Perubahan master komponen tidak mengubah HPP yang sudah tersimpan.</div></div>`}
function openProjectCostLineForm(projectId){const comps=parse(bridge().listCostComponents('',''));if(!comps.length){openCostComponentForm();toast('Buat komponen HPP terlebih dahulu');return}openModal('Tambahkan biaya ke Project',`<form onsubmit="saveProjectCostLineForm(event,${projectId})"><div class="field"><label>Komponen *</label><select id="pcl-component" onchange="updateCostPreview()">${comps.map(c=>`<option value="${c.id}" data-rate="${c.rate}" data-min="${c.minimum_charge}" data-setup="${c.setup_charge}" data-basis="${esc(c.rate_basis)}">${categoryLabel(c.category)} · ${esc(c.name)} — ${esc(c.specification||'')}</option>`).join('')}</select></div><div class="field"><label>Jumlah (<span id="pcl-basis">${esc(comps[0].rate_basis)}</span>) *</label><input id="pcl-qty" type="number" min="0.001" step="any" value="1" required oninput="updateCostPreview()"></div><div class="field"><label>Catatan</label><textarea id="pcl-notes" placeholder="Misalnya allowance waste atau catatan pemakaian"></textarea></div><div class="detailmetric"><small>Estimasi subtotal</small><b id="pcl-preview">${money(Math.max(comps[0].rate,comps[0].minimum_charge)+comps[0].setup_charge)}</b></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Tambahkan biaya</button></div></form>`)}
function updateCostPreview(){const s=$('pcl-component');if(!s)return;const o=s.options[s.selectedIndex],q=Number($('pcl-qty').value||0),rate=Number(o.dataset.rate),min=Number(o.dataset.min),setup=Number(o.dataset.setup);$('pcl-basis').textContent=o.dataset.basis;$('pcl-preview').textContent=money(Math.max(q*rate,min)+setup)}
function saveProjectCostLineForm(e,projectId){e.preventDefault();const id=bridge().addProjectCostLine(projectId,Number($('pcl-component').value),Number($('pcl-qty').value),$('pcl-notes').value);if(id>0){closeModal();projectHpp(projectId);toast('Biaya ditambahkan')}else toast('Gagal menambahkan biaya')}
function removeProjectCost(lineId,projectId){if(!confirm('Hapus baris biaya ini dari perhitungan HPP?'))return;if(bridge().removeProjectCostLine(lineId)){projectHpp(projectId);toast('Baris biaya dihapus')}else toast('Gagal menghapus baris biaya')}
function aboutApp(){const i=JSON.parse(bridge().databaseInfo());alert(i.app+'\nDatabase: '+i.database+'\nSchema: '+i.schema_version+'\nOffline: '+i.offline)}
function customers(){const data=parse(bridge().listCustomers('',100,0));$('main').innerHTML=`<div class="pagehead"><div><button class="link" onclick="go('more')">← More</button><div class="eyebrow">Master data</div><h1>Customers</h1></div><button class="btn" onclick="openCustomerForm()">＋ Customer</button></div>${data.length?`<div class="list">${data.map(c=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(c.name)}</div><div class="itemmeta">${esc(c.phone||'Tanpa nomor telepon')}<br>${esc(c.address||'')}</div></div></div>`).join('')}</div>`:empty('Belum ada customer','Tambahkan customer pertama untuk membuat Sales Order.')}`}
function templates(){const data=parse(bridge().listWorkflowTemplates());$('main').innerHTML=`<div class="pagehead"><div><button class="link" onclick="go('more')">← More</button><div class="eyebrow">Produksi</div><h1>Workflow templates</h1><p class="sub">Template dapat disalin ke Project baru.</p></div><button class="btn" onclick="openTemplateForm()">＋ Template</button></div>${data.length?`<div class="list">${data.map(t=>{const st=parse(bridge().listTemplateStages?bridge().listTemplateStages(t.id):'[]');return `<div class="card"><div class="itemtitle">${esc(t.name)}</div><div class="itemmeta">${esc(t.description||'')}</div><div class="divider"></div><div class="itemmeta">${st.map((s,i)=>(i+1)+'. '+esc(s.name)).join('<br>')||'Belum ada tahap'}</div><button class="btn ghost small" style="margin-top:12px" onclick="openTemplateStageForm(${t.id})">＋ Tambah tahap</button></div>`}).join('')}</div>`:empty('Belum ada template','Buat template, misalnya Cetak Buku atau Cetak Brosur.')}`}
function openModal(title,body){$('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){$('modal').innerHTML=''}
function openCustomerForm(){openModal('Customer baru',`<form onsubmit="saveCustomerForm(event)"><div class="field"><label>Nama customer *</label><input id="c-name" required placeholder="Nama orang atau perusahaan"></div><div class="field"><label>Nomor telepon</label><input id="c-phone" inputmode="tel" placeholder="08…"></div><div class="field"><label>Alamat</label><textarea id="c-address" placeholder="Alamat customer"></textarea></div><div class="field"><label>Catatan</label><textarea id="c-notes"></textarea></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan customer</button></div></form>`)}
function saveCustomerForm(e){e.preventDefault();const id=bridge().saveCustomer(0,$('c-name').value,$('c-phone').value,$('c-address').value,$('c-notes').value);if(id>0){closeModal();toast('Customer tersimpan');render()}else toast('Gagal menyimpan customer')}
function openOrderForm(){const cs=parse(bridge().listCustomers('',100,0));if(!cs.length){openCustomerForm();toast('Tambahkan customer terlebih dahulu');return}const o=null;openModal('Sales Order baru',`<form onsubmit="saveOrderForm(event)"><div class="field"><label>Customer *</label><select id="o-customer" required>${cs.map(c=>`<option value="${c.id}" >${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Tanggal order *</label><input id="o-date" type="date" required value="${today()}"></div><div class="field"><label>Catatan</label><textarea id="o-notes"></textarea></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Buat Sales Order</button></div></form>`)}
function saveOrderForm(e){e.preventDefault();const id=bridge().createSalesOrder(Number($('o-customer').value),$('o-date').value,$('o-notes').value);if(id>0){closeModal();toast('Sales Order dibuat');openOrder(id)}else toast('Gagal membuat Sales Order')}
function openProjectForm(orderId=0){const os=parse(bridge().listSalesOrders('',20,0));if(!os.length){toast('Buat Sales Order terlebih dahulu');openOrderForm();return}const ts=parse(bridge().listWorkflowTemplates());openModal('Project baru',`<form onsubmit="saveProjectForm(event)"><div class="field"><label>Sales Order *</label><select id="p-order" required>${os.map(o=>`<option value="${o.sales_order_id}" ${orderId===o.sales_order_id?'selected':''}>${esc(o.order_number)} · ${esc(o.customer_name)}</option>`).join('')}</select></div><div class="field"><label>Nama Project *</label><input id="p-name" required placeholder="Contoh: Cetak buku katalog"></div><div class="field"><label>Deskripsi</label><textarea id="p-desc" placeholder="Spesifikasi pekerjaan"></textarea></div><div class="formrow"><div class="field"><label>Jumlah *</label><input id="p-qty" type="number" min="0.001" step="any" value="1" required></div><div class="field"><label>Satuan</label><input id="p-unit" value="pcs"></div></div><div class="field"><label>Nilai jual (Rp) *</label><input id="p-sale" type="number" min="0" step="1" value="0" required></div><div class="field"><label>Deadline</label><input id="p-deadline" type="datetime-local"></div><div class="field"><label>Workflow template</label><select id="p-template"><option value="0">Tanpa template</option>${ts.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Buat Project</button></div></form>`)}
function saveProjectForm(e){e.preventDefault();const deadline=$('p-deadline').value?new Date($('p-deadline').value).getTime():0;const id=bridge().createProject(Number($('p-order').value),$('p-name').value,$('p-desc').value,Number($('p-qty').value),$('p-unit').value,Number($('p-sale').value),deadline,Number($('p-template').value));if(id>0){closeModal();toast('Project dibuat');openProject(id)}else toast('Gagal membuat Project')}
function openPaymentForm(orderId){openModal('Catat pembayaran',`<form onsubmit="savePaymentForm(event,${orderId})"><div class="field"><label>Tanggal dan waktu *</label><input id="pay-date" type="datetime-local" required value="${localDateTime()}"></div><div class="field"><label>Nominal (Rp) *</label><input id="pay-amount" type="number" min="1" step="1" required placeholder="2500000"></div><div class="field"><label>Metode</label><select id="pay-method"><option>cash</option><option>transfer</option><option>QRIS</option><option>lainnya</option></select></div><div class="field"><label>Referensi</label><input id="pay-ref" placeholder="Nomor transfer / catatan"></div><div class="field"><label>Catatan</label><textarea id="pay-notes"></textarea></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan pembayaran</button></div></form>`)}
function savePaymentForm(e,orderId){e.preventDefault();const id=bridge().addPayment(orderId,new Date($('pay-date').value).getTime(),Number($('pay-amount').value),$('pay-method').value,$('pay-ref').value,$('pay-notes').value);if(id>0){closeModal();toast('Pembayaran tersimpan');orderDetail(orderId)}else toast('Gagal menyimpan pembayaran')}
function voidPay(id,orderId){if(!confirm('Void transaksi pembayaran ini? Transaksi tetap tersimpan dalam riwayat.'))return;const reason=prompt('Alasan void:')||'';if(bridge().voidPayment(id,reason)){toast('Pembayaran di-void');orderDetail(orderId)}else toast('Tidak dapat void pembayaran')}
function startStage(id,projectId){if(bridge().startProjectStage(id)){toast('Tahap dimulai');openProject(projectId)}else toast('Tahap sebelumnya belum selesai atau status berubah')}
function completeStage(id,projectId){if(!confirm('Tandai tahap ini selesai?'))return;if(bridge().completeProjectStage(id)){toast('Tahap selesai');openProject(projectId)}else toast('Tahap tidak dapat diselesaikan')}
function openStageForm(projectId,sequence){openModal('Tambah tahap workflow',`<form onsubmit="saveStageForm(event,${projectId},${sequence})"><div class="field"><label>Nama tahap *</label><input id="stage-name" required placeholder="Contoh: Laminasi"></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Tambah tahap</button></div></form>`)}
function saveStageForm(e,projectId,sequence){e.preventDefault();const id=bridge().addProjectStage(projectId,$('stage-name').value,sequence);if(id>0){closeModal();openProject(projectId);toast('Tahap ditambahkan')}else toast('Gagal menambahkan tahap')}
function openEstimateForm(stageId,projectId,estimate,pic){const value=estimate?localDateTime(estimate):'';openModal('Estimasi tahap',`<form onsubmit="saveEstimateForm(event,${stageId},${projectId})"><div class="field"><label>Estimasi selesai</label><input id="est-date" type="datetime-local" value="${value}"></div><div class="field"><label>PIC / operator</label><input id="est-pic" value="${esc(pic)}" placeholder="Nama operator"></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan</button></div></form>`)}
function saveEstimateForm(e,stageId,projectId){e.preventDefault();const v=$('est-date').value?new Date($('est-date').value).getTime():0;if(bridge().setStageEstimate(stageId,v,$('est-pic').value)){closeModal();openProject(projectId);toast('Estimasi diperbarui')}else toast('Gagal mengubah estimasi')}
function openTemplateForm(){openModal('Template workflow baru',`<form onsubmit="saveTemplateForm(event)"><div class="field"><label>Nama template *</label><input id="tpl-name" required placeholder="Contoh: Cetak Buku"></div><div class="field"><label>Deskripsi</label><textarea id="tpl-desc"></textarea></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Buat template</button></div></form>`)}
function saveTemplateForm(e){e.preventDefault();const id=bridge().createWorkflowTemplate($('tpl-name').value,$('tpl-desc').value);if(id>0){closeModal();templates();toast('Template dibuat')}else toast('Gagal membuat template')}
function openTemplateStageForm(templateId){const current=parse(bridge().listTemplateStages?bridge().listTemplateStages(templateId):'[]');openModal('Tambah tahap template',`<form onsubmit="saveTemplateStageForm(event,${templateId},${current.length+1})"><div class="field"><label>Nama tahap *</label><input id="tpl-stage-name" required placeholder="Contoh: Persiapan artwork"></div><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Tambah tahap</button></div></form>`)}
function saveTemplateStageForm(e,templateId,seq){e.preventDefault();const id=bridge().addTemplateStage(templateId,$('tpl-stage-name').value,seq);if(id>0){closeModal();templates();toast('Tahap template ditambahkan')}else toast('Gagal menambah tahap')}
// Display initial screen and handle native bridge errors gracefully.
render();
</script>
</body></html>
